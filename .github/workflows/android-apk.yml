name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          out="android/app/build/outputs/apk/release"
          # universal 是「检查更新」的固定下载项；两个拆分包供 Release 页按架构挑选
          declare -A apks=(
            ["DiceFrame-android.apk"]="$out/app-universal-release.apk"
            ["DiceFrame-android-arm64-v8a.apk"]="$out/app-arm64-v8a-release.apk"
            ["DiceFrame-android-armeabi-v7a.apk"]="$out/app-armeabi-v7a-release.apk"
          )
          mkdir -p artifacts
          for name in "${!apks[@]}"; do
            test -s "${apks[$name]}"
            cp "${apks[$name]}" "artifacts/$name"
            sha256sum "artifacts/$name" > "artifacts/$name.sha256"
          done

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diceframe-android-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/DiceFrame-android.apk
            artifacts/DiceFrame-android.apk.sha256
            artifacts/DiceFrame-android-arm64-v8a.apk
            artifacts/DiceFrame-android-arm64-v8a.apk.sha256
            artifacts/DiceFrame-android-armeabi-v7a.apk
            artifacts/DiceFrame-android-armeabi-v7a.apk.sha256
