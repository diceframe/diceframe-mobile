name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "1"
      DICEFRAME_UPLOAD_STORE_PASSWORD: ${{ secrets.DICEFRAME_UPLOAD_STORE_PASSWORD }}
      DICEFRAME_UPLOAD_KEY_ALIAS: ${{ secrets.DICEFRAME_UPLOAD_KEY_ALIAS }}
      DICEFRAME_UPLOAD_KEY_PASSWORD: ${{ secrets.DICEFRAME_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 发给用户的包必须沿用同一签名；缺密钥时停止，避免生成无法覆盖旧版的 APK。
      - name: Restore release signing key
        shell: bash
        env:
          DICEFRAME_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DICEFRAME_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in DICEFRAME_UPLOAD_KEYSTORE_BASE64 DICEFRAME_UPLOAD_STORE_PASSWORD DICEFRAME_UPLOAD_KEY_ALIAS DICEFRAME_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          export DICEFRAME_UPLOAD_STORE_FILE="$RUNNER_TEMP/diceframe-upload.jks"
          umask 077
          printf '%s' "$DICEFRAME_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$DICEFRAME_UPLOAD_STORE_FILE"
          test -s "$DICEFRAME_UPLOAD_STORE_FILE"
          echo "DICEFRAME_UPLOAD_STORE_FILE=$DICEFRAME_UPLOAD_STORE_FILE" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/diceframe-upload.jks"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          out="android/app/build/outputs/apk/release"
          # universal 是「检查更新」的固定下载项；两个拆分包供 Release 页按架构挑选
          declare -A apks=(
            ["DiceFrame-android.apk"]="$out/app-universal-release.apk"
            ["DiceFrame-android-arm64-v8a.apk"]="$out/app-arm64-v8a-release.apk"
            ["DiceFrame-android-armeabi-v7a.apk"]="$out/app-armeabi-v7a-release.apk"
          )
          mkdir -p artifacts
          for name in "${!apks[@]}"; do
            test -s "${apks[$name]}"
            cp "${apks[$name]}" "artifacts/$name"
            sha256sum "artifacts/$name" > "artifacts/$name.sha256"
          done

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diceframe-android-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/DiceFrame-android.apk
            artifacts/DiceFrame-android.apk.sha256
            artifacts/DiceFrame-android-arm64-v8a.apk
            artifacts/DiceFrame-android-arm64-v8a.apk.sha256
            artifacts/DiceFrame-android-armeabi-v7a.apk
            artifacts/DiceFrame-android-armeabi-v7a.apk.sha256
